services:
  api-dev:
    hostname: api-dev
    container_name: takehome-api-dev
    build:
      context: ./docker
      # A docker/api-dev.Dockerfile tartalma, egyetlen eltéréssel: az
      # `apk upgrade` miatt a php83 csomagok verziója egyezik. Enélkül a
      # composer csomag friss php83-iconv-ot húz be a régebbi php83 mellé,
      # az iconv nem töltődik be, és a `composer install` elbukik.
      dockerfile_inline: |
        FROM trafex/php-nginx:3.6.0 AS base

        USER root

        RUN apk upgrade --no-cache && apk add --no-cache \
            php83 \
            php83-common \
            php83-xdebug \
            php83-pdo \
            php83-pdo_mysql \
            composer \
            fish \
            vim

        COPY supervisord.dev.conf   /etc/supervisord.conf
        COPY php.ini                /etc/php83/php.ini
        COPY vimrc                  /etc/vim/vimrc
        COPY xdebug.ini             /etc/php83/conf.d/50_xdebug.ini
        COPY config.fish            /tmp/fish/config.fish
        COPY nginx-server.dev.conf  /etc/nginx/conf.d/default.conf

        ENV XDG_CONFIG_HOME=/tmp
        ENV HOME=/home/nobody
        RUN <<SH
        mkdir -p \
            /tmp/fish \
            /home/nobody

        chown -R nobody:nobody \
            /tmp/fish \
            /home/nobody
        SH

        WORKDIR /var/www/html
        EXPOSE 80
        CMD ["supervisord", "--configuration", "/etc/supervisord.conf"]

        USER nobody
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./api:/var/www/html
    extra_hosts:
      # XDebug csatlakozás miatt kell. Windows alatt, WSL-ből indítva nem
      # tudna rácsatlakozni Windows oldalról. Ha így akarjuk használni,
      # ezt a sort módosítani kell.
      - host.docker.internal:host-gateway
    networks:
      ads_takehome:
    ports:
      - 8080:80
    depends_on:
      db:
        condition: service_healthy

  client-dev:
    hostname: client-dev
    container_name: takehome-client-dev
    build:
      dockerfile: client-dev.Dockerfile
      context: ./docker
    environment:
      # Itt a host gép címére hivatkozunk, mert a böngészőt (jó eséllyel) azon
      # futtatjuk.
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./client:/usr/src/client
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      ads_takehome:
    ports:
      - 5173:5173

  prod:
    hostname: prod
    container_name: takehome-prod
    build:
      context: .
      dockerfile_inline: |
        FROM trafex/php-nginx:3.6.0 AS base

        USER root

        RUN apk upgrade --no-cache && apk add --no-cache \
            php83 \
            php83-common \
            php83-xdebug \
            php83-pdo \
            php83-pdo_mysql \
            nodejs \
            npm \
            vim \
            composer

        COPY api/    /var/www/html/api
        COPY client/ /tmp/client

        WORKDIR /var/www/html/api
        RUN <<SH
        XDEBUG_MODE=off composer install
        SH

        ENV VITE_API_URL=http://localhost:8300/api/v1

        WORKDIR /tmp/client
        RUN <<SH
        npm ci
        npm run build
        cp -r /tmp/client/dist /var/www/html/client
        SH

        COPY docker/supervisord.prod.conf  /etc/supervisord.conf
        COPY docker/php.ini                /etc/php83/php.ini
        COPY docker/xdebug.ini             /etc/php83/conf.d/50_xdebug.ini
        COPY docker/nginx-server.prod.conf /etc/nginx/conf.d/default.conf

        EXPOSE 8000
        EXPOSE 8001

        CMD ["supervisord", "--configuration", "/etc/supervisord.conf"]

        USER nobody
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      ads_takehome:
    ports:
      - 8300:8000
    # depends_on:
    #   db:
    #     condition: service_healthy

  db:
    hostname: db
    container_name: takehome-db
    image: mysql:8.0.36
    command: |
      mysqld 
      --character_set_server=utf8mb4
      --collation_server=utf8mb4_hungarian_ci
      --local-infile=1
    environment:
      TZ: Europe/Budapest
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ${MYSQL_DATA_DIR}:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      ads_takehome:
    ports:
      - 8081:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 0s

  # TODO: dist

networks:
  ads_takehome:
